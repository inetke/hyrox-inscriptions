name: Keep Streamlit Awake - Browser

on:
  schedule:
    - cron: "23 */6 * * *"

  workflow_dispatch:

jobs:
  visit-app:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Visit and wake Streamlit app
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 900 }
            });

            console.log('Opening Streamlit app...');

            await page.goto(
              'https://rfhyroxclub.streamlit.app',
              {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              }
            );

            console.log('Initial URL:', page.url());
            console.log('Initial title:', await page.title());

            // Look for Streamlit's hibernation/wake-up button.
            const wakeButton = page.getByRole('button', {
              name: /yes.*get this app back up/i
            });

            if (await wakeButton.isVisible().catch(() => false)) {
              console.log('Sleeping Streamlit app detected.');
              console.log('Clicking wake-up button...');

              await wakeButton.click();

              console.log('Wake-up requested. Waiting for app to start...');

              await page.waitForTimeout(60000);
            } else {
              console.log('Wake-up button not found. App may already be awake.');
            }

            // Give Streamlit time to establish the browser session.
            await page.waitForTimeout(30000);

            console.log('Final URL:', page.url());
            console.log('Final title:', await page.title());

            const pageText = await page.locator('body').innerText();

            if (/yes.*get this app back up/i.test(pageText)) {
              throw new Error(
                'Streamlit is still showing the sleeping-app screen.'
              );
            }

            console.log('Streamlit sleeping screen is no longer present.');
            console.log('Browser visit completed successfully.');

            await browser.close();
          })();
          EOF