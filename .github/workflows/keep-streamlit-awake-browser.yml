name: Keep Streamlit Awake - Browser

on:
  schedule:
    - cron: "23 */6 * * *"

  workflow_dispatch:

jobs:
  visit-app:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Inspect sleeping Streamlit page
        run: |
          node <<'EOF'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });

            const page = await browser.newPage({
              viewport: { width: 1280, height: 900 }
            });

            console.log('Opening Streamlit app...');

            await page.goto(
              'https://rfhyroxclub.streamlit.app',
              {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              }
            );

            // Wait for Streamlit's page to finish rendering.
            await page.waitForTimeout(10000);

            console.log('\n--- PAGE URL ---');
            console.log(page.url());

            console.log('\n--- PAGE TITLE ---');
            console.log(await page.title());

            console.log('\n--- PAGE TEXT ---');
            console.log(await page.locator('body').innerText());

            console.log('\n--- BUTTONS ---');

            const buttons = await page.locator('button').allTextContents();
            console.log(buttons);

            console.log('\n--- LINKS ---');

            const links = await page.locator('a').allTextContents();
            console.log(links);

            console.log('\n--- INPUTS ---');

            const inputs = await page.locator('input').count();
            console.log('Number of inputs:', inputs);

            console.log('\nInspection completed.');

            await browser.close();
          })();
          EOF